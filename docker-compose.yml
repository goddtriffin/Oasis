services:
  oasis_server:
    image: goddtriffin/oasis:latest
    container_name: oasis_server
    restart: unless-stopped
    ports:
      # host side is set by `make docker_run` (see free-port); container side is always 8080
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - ./.oasis-server.env
